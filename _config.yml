# Site settings for Fishers for Christ Missions
#
# The site is built by GitHub Pages' own Jekyll build, so only plugins on the
# GitHub Pages whitelist are used: https://pages.github.com/versions/

title: "Fishers for Christ Missions"
tagline: "Love in action, for the kingdom of God"
description: "Fishers for Christ Missions is a registered Christian charity and a labour of love, serving people around the world as an extension of God's love."
url: "https://ffchristmissions.github.io"
# Leave empty for a user/organisation site. If the site ever moves to a
# project URL (e.g. /my-project), set it here; every link uses relative_url.
baseurl: ""
lang: en-GB
locale: en_GB
# No GitHub Pages theme: the site has its own layouts and styles
theme: null

# Contact form endpoint (https://formspree.io)
formspree_id: "mqkoeaqb"

# Featured YouTube video (shown on the home and testimonies pages)
youtube_channel: "https://www.youtube.com/@fishersforchristmission473"
featured_video:
  id: "dz_J4hJCyTc"
  title: "A testimony from Fishers for Christ Missions"

# Used by jekyll-seo-tag for search results and social sharing
logo: /assets/images/icon-512.png
social:
  name: "Fishers for Christ Missions"
  links:
    - "https://www.youtube.com/@fishersforchristmission473"
webmaster_verifications:
  google: "Vk0IOJ2jwG_qEoG7fuEXYqv0m2rLa8P778Fi_GrsgEQ"
  bing: "0FB4C028ABCF07C908C54386ABD2D97F"

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/images/og-image.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  smart_quotes: ["apos", "apos", "quot", "quot"]

exclude:
  - _archive
  - _source_images
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
